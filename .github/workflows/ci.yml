name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@619094ad54edc586f5c2733358e00326b30790bd
    with:
      # The old ci.yml had NO coverage job, so `strict` (100% lines, the input
      # default) would be a brand-new gate this repo cannot meet. Measured on
      # origin/main with the same flags this workflow will use
      # (`cargo llvm-cov --workspace --all-features --summary-only`):
      # 84.32% lines. The floor is the measurement rounded DOWN — it records
      # where the repo is, it does not assert where it should be.
      coverage-gate: floor
      coverage-floor: 84
